{% extends 'base.html' %}
{% load tailwind_filters %}

{% block content %}
<div class="p-4 mx-100">
    <h1 class="text-xl font-bold mb-4">Login to your account</h1>
    <form action="" method="post">
        {% csrf_token %}
        {{form|crispy}}
        <button class="inline-block rounded-sm bg-[#99B6FF] px-8 py-3 text-sm font-medium text-white transition hover:scale-110 hover:shadow-xl" type="submit">Log in</button>
    </form>
</div>
{% endblock %}
