{% extends 'nav.html' %}

{% block content %}
    <section class="m-8">
        <div>
            <h1 class="text-3xl font-bold underline">
                Products
            </h1>
            <a href="{% url 'add_product' %}"><h3>+ add new</h3></a>
        </div>
        <div class="grid grid-cols-4 gap-4">
            {% for product in product_list %}
                <div class="border border-gray-200 rounded-sm">
                    <div class="relative h-120">
                        {% if product.image %}
                            <img src="{{ product.image.url }}" alt="{{ product.name }}", class="absolute inset-0 h-full w-full object-cover opacity-100">
                        {% endif %}
                    </div>

                    <div class="relative bg-white p-3">
                        <div class="flex justify-between">
                            <div>
                                <h3 class="text-sm text-gray-700 group-hover:underline group-hover:underline-offset-4">
                                    {{product.name}}
                                </h3>

                                <p class="mt-1.5 tracking-wide text-gray-900">{{product.price}}</p>
                            </div>
                            <form action="{% url 'add_order' %}" method="post">
                                {% csrf_token %}
                                <input type="hidden" name="product" value="{{product.id}}">
                                <button type="submit" class="inline-block rounded-sm bg-[#99B6FF] px-8 py-3 text-sm font-medium text-white transition hover:scale-110 hover:shadow-xl">Add</button>
                            </form>
                        </div>
                    </div>
                </div>
            {% endfor%}
        </div>
    </section>
{% endblock %}
