<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Coffe Shop</title>
</head>
<body class="bg-[#FFF9E0]">
    <div class="mx-auto">
        <nav class="bg-[#243c5a] flex p-4 text-[#FCFCF0]">
            <div class="flex-8">
                <a href="{% url 'product_list' %}">Products</a>
            </div>
            {% if user.is_authenticated %}
                <h1 class="text-right flex-2">Hello {{user.username}}</h1>
            {% endif %}
        </nav>
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
